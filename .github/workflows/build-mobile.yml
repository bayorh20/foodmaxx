name: Build FoodMaxx Mobile Apps (APK & IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug

      - name: Prepare Direct APK Asset
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk client/android/app/build/outputs/apk/debug/FoodMaxx-Native.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodMaxx-Android-APK
          path: client/android/app/build/outputs/apk/debug/FoodMaxx-Native.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Native APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "FoodMaxx 100% Native Mobile App (Latest)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 FoodMaxx 100% Native Mobile App
            - **100% Native Android App Container** (No Chrome Custom Tabs, no browser address bars, no phone browser features)
            - **Push Notifications** with high-resolution banner photo support & auto-open on tap
            - **Ultra-Fast Performance** with native audio synthesizer & haptic vibrations
            - **Direct APK Download**: [FoodMaxx-Native.apk](https://github.com/bayorh20/foodmaxx/releases/download/latest/FoodMaxx-Native.apk)
          files: |
            client/android/app/build/outputs/apk/debug/FoodMaxx-Native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd client
          npx cap sync ios

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Build iOS Archive & Package IPA
        run: |
          cd client/ios/App
          # Detect workspace or project
          if [ -d "App.xcworkspace" ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi
          echo "Building using $TARGET_FLAG"

          # Build archive without code signing
          xcodebuild $TARGET_FLAG \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # Create Payload directory and copy app bundle
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r FoodMaxx-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: FoodMaxx-iOS-IPA
          path: client/ios/App/build/FoodMaxx-iOS.ipa
          if-no-files-found: error
          retention-days: 30
