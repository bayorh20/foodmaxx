    <!-- FoodMaxx Instant Paint Theme & Self-Healing Watchdog -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0D0F14;
        color: #F8FAFC;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      #root {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      @keyframes fmxPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes fmxProgress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(30%); }
        100% { transform: translateX(250%); }
      }
      .fmx-splash-container {
        position: fixed;
        inset: 0;
        background: #0D0F14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        padding: 24px;
        box-sizing: border-box;
      }
      .fmx-splash-logo-box {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(234,76,42,0.25) 0%, rgba(234,76,42,0.05) 70%, transparent 100%);
        border: 1px solid rgba(234,76,42,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(234,76,42,0.2);
        animation: fmxPulse 2s ease-in-out infinite;
        margin-bottom: 20px;
      }
      .fmx-splash-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #FFFFFF;
        margin: 0 0 6px 0;
      }
      .fmx-splash-tagline {
        font-size: 13px;
        color: #94A3B8;
        margin: 0 0 28px 0;
        font-weight: 500;
        text-align: center;
      }
      .fmx-splash-track {
        width: 140px;
        height: 4px;
        background: rgba(255,255,255,0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .fmx-splash-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, #EA4C2A, #FF7E5F);
        border-radius: 999px;
        animation: fmxProgress 1.4s ease-in-out infinite;
      }
      .fmx-rescue-btn {
        margin-top: 24px;
        padding: 10px 22px;
        background: #EA4C2A;
        color: #FFFFFF;
        border: none;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: none;
        box-shadow: 0 4px 15px rgba(234,76,42,0.35);
        transition: transform 0.15s ease;
      }
      .fmx-rescue-btn:active {
        transform: scale(0.96);
      }
    </style>
    <script>
      (function() {
        window.__FOODMAXX_MOUNTED__ = false;

        function fmxHardReset() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
              });
            }
            sessionStorage.clear();
          } catch(e) {}
          window.location.reload(true);
        }
        window.__fmxHardReset = fmxHardReset;

        // Catch chunk loading errors or HTML-as-JS SyntaxErrors
        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message).toLowerCase() : '';
          var src = (e && e.target && e.target.src) ? String(e.target.src) : '';
          if (
            msg.indexOf('unexpected token') !== -1 ||
            msg.indexOf('loading chunk') !== -1 ||
            msg.indexOf('dynamically imported') !== -1 ||
            src.indexOf('/assets/') !== -1
          ) {
            var last = sessionStorage.getItem('fmx_last_auto_recover');
            var now = Date.now();
            if (!last || now - parseInt(last, 10) > 10000) {
              sessionStorage.setItem('fmx_last_auto_recover', String(now));
              fmxHardReset();
            }
          }
        }, true);

        // Display rescue button if app hasn't mounted after 12 seconds
        setTimeout(function() {
          if (!window.__FOODMAXX_MOUNTED__) {
            var btn = document.getElementById('fmx-rescue-btn');
            if (btn) btn.style.display = 'inline-block';
            var msg = document.getElementById('fmx-splash-status');
            if (msg) msg.textContent = 'Taking longer than usual... Tap to reload';
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant Zero-JS Branded Splash Screen -->
      <div id="fmx-splash" class="fmx-splash-container">
        <div class="fmx-splash-logo-box">
          <img src="/foodmaxx-logo.png" alt="FoodMaxx" width="56" height="56" style="object-fit:contain; border-radius:12px;" onerror="this.outerHTML='<span style=\'font-size:36px;\'>🍔</span>'" />
        </div>
        <div class="fmx-splash-title">Food<span style="color:#EA4C2A;">Maxx</span></div>
        <div id="fmx-splash-status" class="fmx-splash-tagline">Hot &amp; fresh meals in minutes</div>
        <div class="fmx-splash-track">
          <div class="fmx-splash-bar"></div>
        </div>
        <button id="fmx-rescue-btn" class="fmx-rescue-btn" onclick="window.__fmxHardReset && window.__fmxHardReset()">
          Refresh App ⚡
        </button>
      </div>
    </div>
